name: Build CubeU v0.0.9 Realtime GPU

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:20260503

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PATH: /opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/wiiu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les outils Wii U
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          "$DEVKITPPC/bin/powerpc-eabi-g++" --version
          cmake --version

          if [ ! -x "/opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake" ]; then
            echo "ERREUR : powerpc-eabi-cmake pour Wii U est introuvable."
            find /opt/devkitpro -type f -name "powerpc-eabi-cmake" -print || true
            exit 1
          fi

          echo "Outils Wii U détectés :"
          find /opt/devkitpro \
            \( -name "elf2rpl" -o -name "wuhbtool" -o -name "powerpc-eabi-cmake" \) \
            -print || true

      - name: Trouver et décompresser CubeU
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          rm -rf "$GITHUB_WORKSPACE/pack"
          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/dist"

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/pack"

          PROJECT_ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "CubeU-v0.0.9-REALTIME-GPU.zip" \
            | head -n 1)"

          if [ -z "$PROJECT_ZIP" ]; then
            PROJECT_ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              | head -n 1)"
          fi

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé à la racine du dépôt."
            echo "Fichiers présents :"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Archive détectée : $PROJECT_ZIP"

          python3 - "$PROJECT_ZIP" "$GITHUB_WORKSPACE/extracted" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as zip_file:
              zip_file.extractall(destination)

          print("Première décompression terminée.")
          PY

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "CMakeLists.txt" \
            -printf "%h\n" \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            INNER_ZIP="$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -iname "*.zip" \
              | head -n 1)"

            if [ -n "$INNER_ZIP" ]; then
              echo "Archive intérieure détectée : $INNER_ZIP"

              rm -rf "$GITHUB_WORKSPACE/pack"
              mkdir -p "$GITHUB_WORKSPACE/pack"

              python3 - "$INNER_ZIP" "$GITHUB_WORKSPACE/pack" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as zip_file:
              zip_file.extractall(destination)

          print("Archive intérieure décompressée.")
          PY

              PROJECT_DIR="$(find "$GITHUB_WORKSPACE/pack" \
                -type f \
                -name "CMakeLists.txt" \
                -printf "%h\n" \
                | head -n 1)"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : aucun CMakeLists.txt trouvé."
            echo "Contenu extrait :"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 8 -type f -print
            find "$GITHUB_WORKSPACE/pack" -maxdepth 8 -type f -print || true
            exit 1
          fi

          echo "Projet CubeU détecté dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer CubeU pour Wii U
        shell: bash
        run: |
          set -euo pipefail

          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Vérifier la configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Compilateur configuré :"
          grep -E \
            "CMAKE_C_COMPILER:|CMAKE_CXX_COMPILER:|CMAKE_SYSTEM_NAME:" \
            "$GITHUB_WORKSPACE/build/CMakeCache.txt" || true

          if grep -R "/portlibs/wii/" \
            "$GITHUB_WORKSPACE/build" \
            --include="*.txt" \
            --include="*.cmake"; then
            echo "ERREUR : configuration Wii détectée à la place de Wii U."
            exit 1
          fi

      - name: Compiler CubeU
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build "$GITHUB_WORKSPACE/build" \
            --parallel 2 \
            --verbose

      - name: Rechercher le résultat
        shell: bash
        run: |
          set -euo pipefail

          echo "Fichiers produits :"
          find "$GITHUB_WORKSPACE/build" -type f -print

          WUHB_FILE="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -iname "*.wuhb" \
            | head -n 1)"

          if [ -z "$WUHB_FILE" ]; then
            RPX_FILE="$(find "$GITHUB_WORKSPACE/build" \
              -type f \
              -iname "*.rpx" \
              | head -n 1)"

            if [ -n "$RPX_FILE" ]; then
              echo "Un RPX a été produit, mais aucun WUHB : $RPX_FILE"
            fi

            echo "ERREUR : aucun fichier .wuhb n'a été produit."
            exit 1
          fi

          echo "WUHB trouvé : $WUHB_FILE"
          echo "WUHB_FILE=$WUHB_FILE" >> "$GITHUB_ENV"

      - name: Préparer les fichiers pour la carte SD
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU"

          cp "$WUHB_FILE" \
            "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/CubeU.wuhb"

          if [ -f "$PROJECT_DIR/README.md" ]; then
            cp "$PROJECT_DIR/README.md" \
              "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/README.txt"
          fi

          echo "Contenu final :"
          find "$GITHUB_WORKSPACE/dist" -type f -print

      - name: Publier CubeU
        uses: actions/upload-artifact@v4
        with:
          name: CubeU-v0.0.9-Realtime-GPU-WiiU
          path: dist/
          if-no-files-found: error
          retention-days: 30
