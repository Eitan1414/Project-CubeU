name: Build CubeU v0.0.3 Wii U

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:20260503

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PATH: /opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/wiiu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les outils Wii U
        shell: bash
        run: |
          set -euo pipefail

          echo "Vérification du compilateur PowerPC..."
          "$DEVKITPPC/bin/powerpc-eabi-g++" --version

          echo "Vérification de CMake Wii U..."
          if [ ! -x "/opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake" ]; then
            echo "ERREUR : le compilateur CMake Wii U est absent."
            echo "Contenu des portlibs :"
            find /opt/devkitpro/portlibs -maxdepth 3 -type f \
              -name "powerpc-eabi-cmake" -print || true
            exit 1
          fi

          echo "Vérification de WUT..."
          if [ ! -d "/opt/devkitpro/wut" ] && \
             [ ! -f "/opt/devkitpro/cmake/WiiU.cmake" ]; then
            echo "ERREUR : WUT ou WiiU.cmake est absent."
            find /opt/devkitpro -maxdepth 4 \
              \( -iname "*wut*" -o -iname "WiiU.cmake" \) \
              -print || true
            exit 1
          fi

          echo "Environnement Wii U détecté."

      - name: Décompresser CubeU
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          rm -rf "$GITHUB_WORKSPACE/pack"

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/pack"

          PROJECT_ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "CubeU-v0.0.3-project.zip" \
            | head -n 1)"

          if [ -z "$PROJECT_ZIP" ]; then
            PACK_ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              | head -n 1)"

            if [ -z "$PACK_ZIP" ]; then
              echo "ERREUR : aucun fichier ZIP trouvé."
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print
              exit 1
            fi

            echo "Pack détecté : $PACK_ZIP"

            python3 - "$PACK_ZIP" "$GITHUB_WORKSPACE/pack" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as z:
              z.extractall(destination)

          print("Pack décompressé.")
          PY

            PROJECT_ZIP="$(find "$GITHUB_WORKSPACE/pack" \
              -type f \
              -iname "CubeU-v0.0.3-project.zip" \
              | head -n 1)"

            if [ -z "$PROJECT_ZIP" ]; then
              echo "Aucun ZIP intérieur trouvé, recherche directe du projet."

              PROJECT_DIR="$(find "$GITHUB_WORKSPACE/pack" \
                -type f \
                -name "CMakeLists.txt" \
                -printf "%h\n" \
                | head -n 1)"

              if [ -z "$PROJECT_DIR" ]; then
                echo "ERREUR : projet CubeU introuvable dans le pack."
                find "$GITHUB_WORKSPACE/pack" -maxdepth 8 -type f -print
                exit 1
              fi

              echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo "Projet ZIP détecté : $PROJECT_ZIP"

          python3 - "$PROJECT_ZIP" "$GITHUB_WORKSPACE/extracted" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as z:
              z.extractall(destination)

          print("Projet décompressé.")
          PY

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "CMakeLists.txt" \
            -printf "%h\n" \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : CMakeLists.txt introuvable."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 8 -type f -print
            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer CubeU pour Wii U
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Vérifier la configuration Wii U
        shell: bash
        run: |
          set -euo pipefail

          echo "Configuration CMake utilisée :"

          grep -E \
            "CMAKE_SYSTEM_NAME|CMAKE_CXX_COMPILER|NintendoWiiU" \
            "$GITHUB_WORKSPACE/build/CMakeCache.txt" || true

          if grep -R "/portlibs/wii/" \
            "$GITHUB_WORKSPACE/build" \
            --include="*.txt" \
            --include="*.cmake"; then
            echo "ERREUR : le projet utilise encore la configuration Wii."
            exit 1
          fi

      - name: Compiler CubeU
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build "$GITHUB_WORKSPACE/build" \
            --parallel 2 \
            --verbose

      - name: Rechercher le WUHB
        shell: bash
        run: |
          set -euo pipefail

          echo "Fichiers créés :"
          find "$GITHUB_WORKSPACE/build" -type f -print

          WUHB_FILE="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -iname "*.wuhb" \
            | head -n 1)"

          if [ -z "$WUHB_FILE" ]; then
            echo "ERREUR : CubeU a compilé, mais aucun WUHB n'a été créé."

            RPX_FILE="$(find "$GITHUB_WORKSPACE/build" \
              -type f \
              -iname "*.rpx" \
              | head -n 1)"

            if [ -n "$RPX_FILE" ]; then
              echo "Un RPX a cependant été produit : $RPX_FILE"
            fi

            exit 1
          fi

          echo "WUHB_FILE=$WUHB_FILE" >> "$GITHUB_ENV"
          echo "WUHB créé : $WUHB_FILE"

      - name: Préparer la carte SD
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU"

          cp "$WUHB_FILE" \
            "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/CubeU.wuhb"

          if [ -f "$PROJECT_DIR/README.md" ]; then
            cp "$PROJECT_DIR/README.md" \
              "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/README.txt"
          fi

          echo "Résultat :"
          find "$GITHUB_WORKSPACE/dist" -type f -print

      - name: Publier CubeU
        uses: actions/upload-artifact@v4
        with:
          name: CubeU-v0.0.3-WiiU
          path: dist/
          if-no-files-found: error
