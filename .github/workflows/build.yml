name: Build CubeU v0.0.3

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:20260503

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PATH: /opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/wiiu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier le compilateur
        shell: bash
        run: |
          set -euo pipefail

          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version
          cmake --version

      - name: Trouver et décompresser CubeU
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          PROJECT_ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "CubeU-v0.0.3-project.zip" \
            | head -n 1)"

          if [ -n "$PROJECT_ZIP" ]; then
            echo "ZIP du projet trouvé directement : $PROJECT_ZIP"

            python3 - "$PROJECT_ZIP" "$GITHUB_WORKSPACE/extracted" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as z:
              z.extractall(destination)

          print("Projet décompressé.")
          PY

          else
            PACK_ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              | head -n 1)"

            if [ -z "$PACK_ZIP" ]; then
              echo "ERREUR : aucun fichier ZIP trouvé."
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print
              exit 1
            fi

            echo "Pack trouvé : $PACK_ZIP"

            mkdir -p "$GITHUB_WORKSPACE/pack"

            python3 - "$PACK_ZIP" "$GITHUB_WORKSPACE/pack" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as z:
              z.extractall(destination)

          print("Pack décompressé.")
          PY

            PROJECT_ZIP="$(find "$GITHUB_WORKSPACE/pack" \
              -type f \
              -iname "CubeU-v0.0.3-project.zip" \
              | head -n 1)"

            if [ -z "$PROJECT_ZIP" ]; then
              echo "ERREUR : CubeU-v0.0.3-project.zip introuvable dans le pack."
              find "$GITHUB_WORKSPACE/pack" -maxdepth 6 -type f -print
              exit 1
            fi

            echo "ZIP intérieur trouvé : $PROJECT_ZIP"

            python3 - "$PROJECT_ZIP" "$GITHUB_WORKSPACE/extracted" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as z:
              z.extractall(destination)

          print("Projet intérieur décompressé.")
          PY
          fi

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "CMakeLists.txt" \
            -printf "%h\n" \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : CMakeLists.txt introuvable après décompression."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 8 -type f -print
            exit 1
          fi

          echo "Projet détecté : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Trouver CMake Wii U
        shell: bash
        run: |
          set -euo pipefail

          CMAKE_WIIU="$(find /opt/devkitpro \
            -type f \
            -name "powerpc-eabi-cmake" \
            | head -n 1)"

          if [ -z "$CMAKE_WIIU" ]; then
            echo "ERREUR : powerpc-eabi-cmake introuvable."
            find /opt/devkitpro -maxdepth 6 -type f \
              \( -name "powerpc-eabi-cmake" -o -name "wuhbtool" -o -name "elf2rpl" \) \
              -print || true
            exit 1
          fi

          chmod +x "$CMAKE_WIIU"

          echo "CMAKE_WIIU=$CMAKE_WIIU" >> "$GITHUB_ENV"
          echo "CMake Wii U trouvé : $CMAKE_WIIU"

      - name: Configurer CubeU
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          "$CMAKE_WIIU" \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compiler CubeU
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build "$GITHUB_WORKSPACE/build" \
            --parallel 2 \
            --verbose

      - name: Préparer CubeU
        shell: bash
        run: |
          set -euo pipefail

          echo "Fichiers produits :"
          find "$GITHUB_WORKSPACE/build" -type f -print

          WUHB_FILE="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -iname "*.wuhb" \
            | head -n 1)"

          if [ -z "$WUHB_FILE" ]; then
            echo "ERREUR : aucun fichier .wuhb produit."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU"

          cp "$WUHB_FILE" \
            "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/CubeU.wuhb"

          if [ -f "$PROJECT_DIR/README.md" ]; then
            cp "$PROJECT_DIR/README.md" \
              "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/README.txt"
          fi

          echo "Résultat final :"
          find "$GITHUB_WORKSPACE/dist" -type f -print

      - name: Publier CubeU
        uses: actions/upload-artifact@v4
        with:
          name: CubeU-v0.0.3-WiiU
          path: dist/
          if-no-files-found: error
