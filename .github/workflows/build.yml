name: Build CubeU v0.0.3 from ZIP

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les outils installés
        shell: bash
        run: |
          set -e

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          powerpc-eabi-gcc --version
          cmake --version

          echo "Contenu de /opt/devkitpro :"
          ls -la /opt/devkitpro

          echo "Recherche des outils Wii U :"
          find /opt/devkitpro -name "wuhbtool" -o -name "elf2rpl" -o -name "powerpc-eabi-cmake" || true

      - name: Décompresser le projet CubeU
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname 'CubeU-v0.0.3-project.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé à la racine du dépôt."
            echo "Fichiers présents :"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f
            exit 1
          fi

          echo "Archive détectée : $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          python3 - "$ZIP_FILE" "$GITHUB_WORKSPACE/extracted" <<'PYTHON'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as zip_file:
              zip_file.extractall(destination)

          print("Archive décompressée avec succès.")
          PYTHON

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name CMakeLists.txt \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : aucun CMakeLists.txt trouvé dans le ZIP."
            echo "Contenu extrait :"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f
            exit 1
          fi

          echo "Projet trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Trouver CMake Wii U
        shell: bash
        run: |
          set -euo pipefail

          CMAKE_WIIU="$(find /opt/devkitpro \
            -type f \
            -name powerpc-eabi-cmake \
            | head -n 1)"

          if [ -z "$CMAKE_WIIU" ]; then
            echo "ERREUR : powerpc-eabi-cmake est introuvable."
            echo "L'image devkitPro ne contient peut-être pas wiiu-dev."
            find /opt/devkitpro -maxdepth 5 -type f \
              \( -name '*cmake*' -o -name 'elf2rpl' -o -name 'wuhbtool' \) \
              || true
            exit 1
          fi

          echo "CMake Wii U trouvé : $CMAKE_WIIU"
          echo "CMAKE_WIIU=$CMAKE_WIIU" >> "$GITHUB_ENV"

      - name: Configurer CubeU
        shell: bash
        run: |
          set -euo pipefail

          "$CMAKE_WIIU" \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compiler CubeU
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build "$GITHUB_WORKSPACE/build" \
            --parallel 2 \
            --verbose

      - name: Rechercher le résultat
        shell: bash
        run: |
          set -euo pipefail

          echo "Fichiers produits :"
          find "$GITHUB_WORKSPACE/build" -type f -print

          WUHB_FILE="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -iname '*.wuhb' \
            | head -n 1)"

          if [ -z "$WUHB_FILE" ]; then
            echo "ERREUR : aucun fichier .wuhb n'a été produit."
            exit 1
          fi

          echo "WUHB trouvé : $WUHB_FILE"
          echo "WUHB_FILE=$WUHB_FILE" >> "$GITHUB_ENV"

      - name: Préparer CubeU pour la carte SD
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU"

          cp "$WUHB_FILE" \
            "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/CubeU.wuhb"

          if [ -f "$PROJECT_DIR/README.md" ]; then
            cp "$PROJECT_DIR/README.md" \
              "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/README.txt"
          fi

          echo "Contenu final :"
          find "$GITHUB_WORKSPACE/dist" -type f -print

      - name: Envoyer CubeU comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: CubeU-v0.0.3-WiiU
          path: dist/
          if-no-files-found: error
