name: Build CubeU v0.0.3

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:20260503

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PATH: /opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/wiiu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier devkitPPC et WUT
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          echo "PATH=$PATH"

          if [ ! -x "$DEVKITPPC/bin/powerpc-eabi-gcc" ]; then
            echo "ERREUR : compilateur PowerPC absent."
            find /opt/devkitpro -maxdepth 4 -type f -name "powerpc-eabi-gcc" || true
            exit 1
          fi

          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version
          cmake --version

          echo "Outils Wii U disponibles :"
          find /opt/devkitpro \
            \( -name "wuhbtool" -o -name "elf2rpl" -o -name "powerpc-eabi-cmake" \) \
            -print || true

      - name: Trouver et décompresser CubeU
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "CubeU-v0.0.3-project.zip" \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun ZIP trouvé à la racine du dépôt."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP utilisé : $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          python3 - "$ZIP_FILE" "$GITHUB_WORKSPACE/extracted" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = sys.argv[2]

          with zipfile.ZipFile(archive, "r") as file:
              file.extractall(destination)

          print("Décompression terminée.")
          PY

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "CMakeLists.txt" \
            -printf "%h\n" \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : CMakeLists.txt introuvable dans le ZIP."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 6 -type f -print
            exit 1
          fi

          echo "Projet détecté : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Trouver le système CMake Wii U
        shell: bash
        run: |
          set -euo pipefail

          CMAKE_WIIU="$(find /opt/devkitpro \
            -type f \
            -name "powerpc-eabi-cmake" \
            | head -n 1)"

          if [ -n "$CMAKE_WIIU" ]; then
            chmod +x "$CMAKE_WIIU"
            echo "CMAKE_WIIU=$CMAKE_WIIU" >> "$GITHUB_ENV"
            echo "Outil détecté : $CMAKE_WIIU"
            exit 0
          fi

          TOOLCHAIN_FILE="$(find /opt/devkitpro \
            -type f \
            \( -iname "*wiiu*.cmake" -o -iname "*wut*.cmake" \) \
            | head -n 1)"

          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "ERREUR : aucun outil CMake Wii U trouvé."
            find /opt/devkitpro -maxdepth 6 -type f \
              \( -iname "*cmake*" -o -name "elf2rpl" -o -name "wuhbtool" \) \
              -print || true
            exit 1
          fi

          echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE" >> "$GITHUB_ENV"
          echo "Toolchain détectée : $TOOLCHAIN_FILE"

      - name: Configurer CubeU
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          if [ -n "${CMAKE_WIIU:-}" ]; then
            "$CMAKE_WIIU" \
              -S "$PROJECT_DIR" \
              -B "$GITHUB_WORKSPACE/build" \
              -DCMAKE_BUILD_TYPE=Release
          else
            cmake \
              -S "$PROJECT_DIR" \
              -B "$GITHUB_WORKSPACE/build" \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
              -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Compiler CubeU
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build "$GITHUB_WORKSPACE/build" \
            --parallel 2 \
            --verbose

      - name: Préparer le résultat
        shell: bash
        run: |
          set -euo pipefail

          echo "Fichiers compilés :"
          find "$GITHUB_WORKSPACE/build" -type f -print

          WUHB_FILE="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -iname "*.wuhb" \
            | head -n 1)"

          if [ -z "$WUHB_FILE" ]; then
            echo "ERREUR : aucun fichier WUHB produit."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU"

          cp "$WUHB_FILE" \
            "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/CubeU.wuhb"

          if [ -f "$PROJECT_DIR/README.md" ]; then
            cp "$PROJECT_DIR/README.md" \
              "$GITHUB_WORKSPACE/dist/wiiu/apps/CubeU/README.txt"
          fi

          echo "Résultat final :"
          find "$GITHUB_WORKSPACE/dist" -type f -print

      - name: Publier CubeU
        uses: actions/upload-artifact@v4
        with:
          name: CubeU-v0.0.3-WiiU
          path: dist/
          if-no-files-found: error
